# Toolchain pins (CLAUDE.md, Toolchain pins). Do not change without the
# maintainer's approval.
#
# DuckDB Python and @duckdb/duckdb-wasm must run the same DuckDB engine
# major.minor, so that Parquet written by the ingest package is read by the
# application exactly as written. The npm package is numbered independently of
# the engine it bundles; duckdb_engine records the engine inside the pinned
# duckdb-wasm (from SELECT version() in Node). The cross-read tests in both
# packages check these values.

python: "3.13"
node: "24"
duckdb_python: "1.4.5"
duckdb_wasm_npm: "1.32.0"
duckdb_engine: "1.4.3"
duckdb_engine_minor: "1.4"

# DuckDB extensions served from the platform's own origin
# (/assets/duckdb-extensions/, requirements §9: no request leaves the origin).
# DuckDB-WASM requests <repository>/v<engine>/<platform>/<name>.duckdb_extension.wasm;
# the bundle selector uses the mvp and eh builds only (no threads). Files are
# fetched once from the source below for the pinned engine, checked against
# these sha256 values (of the decoded file), cached locally for development
# and tests, and uploaded to the bucket by deploy.yml. json is included because
# the contract's JSON columns (region.attributes) load it when queried.
duckdb_extensions:
  source: "https://extensions.duckdb.org"
  engine: "v1.4.3"
  platforms: ["wasm_mvp", "wasm_eh"]
  names: ["parquet", "json"]
  sha256:
    wasm_mvp/parquet: "0785c6c95d003eff4faa7b3b4b660f02c9c92f6d68d135ddf330d42e3a650600"
    wasm_mvp/json: "5771b6d57335eca8e2ba4fdaacb491a53b49577bd7f1b0c39e2cd7a39b4e9313"
    wasm_eh/parquet: "22765c8f7dc741cda2b571a66ac7bb355295d7d69a6c37e5315b265672984f55"
    wasm_eh/json: "b997276c8e15cc3ebdeda340d73d15dc1c4f4755ad281280451cb0a2f79302e9"
