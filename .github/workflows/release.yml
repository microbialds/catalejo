# Data release workflow (requirements §11, contract §8.4). Skeleton written in
# milestone 0; the steps are completed in milestone 5. Manual trigger only.
# No workflow writes to git.
name: release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release identifier, YYYY-MM with an optional letter suffix (2026-09, 2026-09b)"
        required: true
        type: string
      group_id:
        description: "Access group to build a filtered release for; empty for the full release"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Not yet implemented
        run: |
          echo "release.yml is a skeleton until milestone 5."
          echo "release_id=${{ inputs.release_id }} group_id=${{ inputs.group_id }}"

      # 1. Set up uv and install packages/ingest (uv sync --locked).
      # 2. Run the ingest test suite (uv run pytest) before touching data.
      # 3. Obtain the master catalog catalog/<release_id>.duckdb together with
      #    its per-genome file directory catalog/<release_id>.files/, which
      #    release build refuses to run without (contract §5). The catalog
      #    lives on the lab server and its backups; milestone 5 defines how
      #    the workflow obtains both (a workflow artifact or a mounted path).
      # 4. catalejo release check --catalog catalog/<release_id>.duckdb
      #    (fails the workflow on any contract §9 failure).
      # 5. catalejo release build --catalog catalog/<release_id>.duckdb
      #    --out releases/<release_id>/ [--group <group_id>] (deterministic;
      #    manifest.json at the root).
      # 6. catalejo release check --catalog catalog/<release_id>.duckdb
      #    --release releases/<release_id>/ (verifies the manifest checksums
      #    of the built release and of its group releases).
      # 7. catalejo release publish --dir releases/<release_id>/ --bucket catalejo-releases
      #    [--group <group_id>], credentials from repository secrets
      #    (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, CLOUDFLARE_ACCOUNT_ID).
      # 8. Update the pointer file, releases/current.json for the full release
      #    or releases/<group_id>/current.json for a group, to the content
      #    {"release_id":"<release_id>"}.
      # 9. Post the release notes (NOTES.md) as the workflow summary
      #    ($GITHUB_STEP_SUMMARY).
