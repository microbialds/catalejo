# Application deployment workflow (requirements §11, contract §8.4). Skeleton
# written in milestone 0; the steps are completed in milestone 5. Triggered by
# a tag web-vX.Y.Z, which only the maintainer creates. No workflow writes to git.
name: deploy

on:
  push:
    tags:
      - "web-v*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
