      # 2. Run lint, typecheck, test and e2e for packages/web.
      # 3. pnpm --dir packages/web build.
      # 4. For each Pages project (one per instance), read releases/current.json
      #    for the instance's group and the manifest.json it points to.
      # 5. Fail the deployment if the manifest's schema_version is outside the
      #    application's supported schema_version range.
      # 6. Deploy packages/web/dist to each Pages project with wrangler
      #    (CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from repository secrets).
