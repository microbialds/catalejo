[project]
name = "catalejo-ingest"
version = "0.1.0"
description = "Catalejo ingestion package: mgap parsers, master catalog, release build and the catalejo command."
requires-python = "==3.13.*"
license = "MIT"
dependencies = [
    # DuckDB Python is pinned to the engine minor of @duckdb/duckdb-wasm
    # (config/versions.yaml); the cross-read test checks it.
    "duckdb==1.4.5",
    "pyarrow==25.0.1",
    "polars==1.44.2",
    "biopython==1.88",
    "typer==0.27.2",
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "pyright==1.1.414",
]

[project.scripts]
catalejo = "ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ingest"]

# pytest and pyright read their configuration from the working directory, and
# the commands in CLAUDE.md run from the repository root, so their settings
# live in the root pytest.ini and pyrightconfig.json. The sections below make
# the same commands work when run from this directory.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: the default-size synthetic run (about 60 genomes)"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
