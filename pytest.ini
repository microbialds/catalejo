# pytest configuration for `uv run --project packages/ingest pytest` run from
# the repository root (CLAUDE.md, Commands). pytest reads its configuration
# from the working directory, so the ingest package's settings are repeated
# here; keep them in step with packages/ingest/pyproject.toml.
[pytest]
testpaths = packages/ingest/tests
addopts = -ra --strict-markers
markers =
    slow: the default-size synthetic run (about 60 genomes)
