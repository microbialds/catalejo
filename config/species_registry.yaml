# Species registry (contract §3.3, §4.9 and §5.1).
#
# One entry per species the collection may contain. `catalejo ingest` loads
# this file into the species_registry table, and a genome whose assigned
# species is absent from it fails validation. Species are matched by canonical
# name, alias, GTDB name and MLST scheme, so no alias or scheme may belong to
# two species. Adding a species is a change to this file.
#
# color_index is a position in the species sequence of config/palette.yaml and
# gives the species its color in every chart and chip. Indices are assigned
# once and freeze at the first real release, because a color that moves
# between releases would break figures and the reader's memory of them. The
# order below comes from the synthetic generator, with the three default
# synthetic species first. If the main species of the collection differ,
# reorder the indices before the first real release. Species beyond the eighth
# have a null index and take the palette's other color.
#
# ncbi_taxid and gtdb_name are filled only where they are certain; the rest
# are left null for the maintainer to complete. The synthetic generator takes
# species codes, names and MLST schemes from this file (contract §10).

version: 1

species:
  - species_code: KPN
    canonical_name: Klebsiella pneumoniae
    gtdb_name: Klebsiella pneumoniae
    ncbi_taxid: 573
    aliases:
      - Klebsiella pneumoniae subsp. pneumoniae
    mlst_schemes:
      - klebsiella
    pangenome_eligible: true
    color_index: 0

  - species_code: SEN
