# Platform parameters (contract §3, §7 and §8; requirements §5.4, §6.1, §6.7).
#
# Every catalejo command reads this file and config/species_registry.yaml
# (data contract 0.7 §8). Values here are
# parameters of the platform, and changing one changes what a release
# contains, so a change is recorded in the release notes.

version: 1

platform_name: Catalejo

# Pattern every genome_id must match (data contract 0.7 §3.1). Collections receive
# identifiers from many origins, so the default is open within a character set
# that is safe in paths and URLs; a group may tighten it here. Identifiers must
# also be unique without regard to case, since release files may sit on file
# systems that ignore case; `catalejo metadata validate` and `catalejo release
# check` enforce both from milestone 1a.
genome_id_pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"

# Rules that derive a candidate genome_id from an mgap sample directory name
# (data contract 0.7 §3.1 and §4.2, mgap_sample). `catalejo metadata init`
# applies them in order as regular expression substitutions and writes both
# columns for the maintainer to review; a manual entry in metadata.csv always
# wins. Some projects prefix nanopore samples with ont_ (ont_SCL30014 is
# SCL30014), and mgap file stems may end in an underscore.
sample_name_rules:
  - pattern: "(?i)^ont_"
    replace: ""
  - pattern: "_+$"
    replace: ""

# Order in which species sources are consulted (contract §3.3). The first
# source that yields a name wins, and disagreement with a later source sets
# species_conflict.
species_precedence:
  - metadata
  - gtdbtk
  - mlst
  - kraken2

thresholds:
  # Reciprocal overlap on the same contig and strand above which an old
  # feature maps to a new one (contract §3.4).
  feature_mapping_overlap: 0.9
  # Shared member fraction of the smaller cluster above which two pangenome
  # clusters are the same across releases (contract §3.5).
  cluster_mapping_shared: 0.5
  # Features on each side of a focal feature in a neighborhood (contract §7.2).
  neighborhood_window: 8
  # Largest genome set for the cross-genome neighborhood comparison
  # (contract §7.3, requirements §6.4).
  neighborhood_comparison_cap: 200
  # Largest genome set drawn in the presence and absence heatmap
  # (requirements §6.2).
  heatmap_genome_cap: 2000
  # Species drawn individually in collection charts; the smallest beyond this
  # number are grouped as Other (requirements §5.4, §6.1).
  chart_species_max: 8

# Assembly quality thresholds drawn on the collection page QC scatter and used
# for the QC flag in summaries/qc.parquet (contract §6.2). A genome passes when
# completeness is at least completeness_min and contamination is at most
# contamination_max, both in percent from CheckM2.
qc:
  completeness_min: 95
  contamination_max: 5

# Projection of genome embeddings computed by `catalejo release build`
# (contract §4.5, requirements §6.7). Recorded in the embedding table and the
# manifest so the embedding map can be reproduced from the release alone.
umap:
  n_neighbors: 30
  min_dist: 0.1
  seed: 42
  metric: cosine
